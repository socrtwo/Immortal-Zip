name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to create (e.g. v1.0.9). When set, the run publishes a release at this tag."
        required: false
        default: ''

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  linux:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.11' }
      - name: System deps
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            python3-tk binutils dpkg-dev fakeroot file desktop-file-utils \
            libfuse2 wget
      - name: Python deps
        run: pip install pyinstaller==6.10.0
      - name: Get appimagetool
        run: |
          wget -q https://github.com/AppImage/AppImageKit/releases/download/continuous/appimagetool-x86_64.AppImage -O /usr/local/bin/appimagetool
          chmod +x /usr/local/bin/appimagetool
      - name: Build Linux artifacts
        run: bash build/build_linux.sh
      - uses: actions/upload-artifact@v4
        with:
          name: linux
          if-no-files-found: error
          path: |
            dist/*.AppImage
            dist/*.deb
            dist/*.tar.gz

  macos:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.11' }
      - name: Python deps
        run: pip install pyinstaller==6.10.0
      - name: Build macOS artifacts
        run: bash build/build_macos.sh
      - uses: actions/upload-artifact@v4
        with:
          name: macos
          if-no-files-found: error
          path: dist/*.dmg

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.11' }
      - name: Python deps
        run: pip install pyinstaller==6.10.0
      - name: Install NSIS
        run: choco install nsis -y --no-progress
      - name: Build Windows installer
        shell: pwsh
        run: ./build/build_windows.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          if-no-files-found: error
          path: dist/*Setup.exe

  android:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '20' }
      - uses: actions/setup-java@v4
        with: { distribution: 'temurin', java-version: '17' }
      - uses: android-actions/setup-android@v3
      - name: Build APK
        env:
          PAGES_HOST: socrtwo.github.io/Immortal-Zip
          KEYSTORE_PASS: ${{ secrets.ANDROID_KEYSTORE_PASS || 'immortal-zip' }}
        run: bash build/build_android.sh
      - uses: actions/upload-artifact@v4
        with:
          name: android
          if-no-files-found: error
          path: dist/*.apk

  ios:
    runs-on: macos-14
    # Only run if Apple signing secrets are present — otherwise the IPA
    # cannot be produced and the job would always fail.
    if: ${{ vars.IOS_ENABLED == 'true' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '20' }
      - name: Import signing cert
        env:
          IOS_P12_BASE64: ${{ secrets.IOS_P12_BASE64 }}
          IOS_P12_PASSWORD: ${{ secrets.IOS_P12_PASSWORD }}
        run: |
          echo "$IOS_P12_BASE64" | base64 --decode > cert.p12
          KEYCHAIN=build.keychain
          security create-keychain -p actions "$KEYCHAIN"
          security default-keychain -s "$KEYCHAIN"
          security unlock-keychain -p actions "$KEYCHAIN"
          security import cert.p12 -k "$KEYCHAIN" -P "$IOS_P12_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k actions "$KEYCHAIN"
      - name: Build IPA
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          EXPORT_METHOD: ad-hoc
        run: bash build/build_ios.sh
      - uses: actions/upload-artifact@v4
        with:
          name: ios
          if-no-files-found: error
          path: dist/*.ipa

  web:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Package web bundle
        env:
          RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
        run: |
          VERSION="${RELEASE_TAG#v}"
          mkdir -p dist
          (cd web && zip -r "../dist/Immortal-Zip-Web-${VERSION}.zip" .)
      - uses: actions/upload-artifact@v4
        with:
          name: web
          if-no-files-found: error
          path: dist/*.zip

  chromeos-ios:
    # ChromeOS ships the MV3 extension from chromeos/; the iOS bundle
    # ships the PWA plus the Xcode wrapper sources (an App Store IPA
    # needs the maintainer's signing identity, so it is only built by
    # the gated `ios` job when IOS_ENABLED is set).
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Package ChromeOS extension bundle
        env:
          RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
        run: |
          VERSION="${RELEASE_TAG#v}"
          mkdir -p dist
          (cd chromeos && zip -r "../dist/Immortal-Zip-chromeos-${VERSION}.zip" .)
      - name: Package iOS bundle
        env:
          RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
        run: |
          VERSION="${RELEASE_TAG#v}"
          stage=$(mktemp -d)
          mkdir -p "$stage/pwa"
          cp -r web/. "$stage/pwa/"
          cp -r ios "$stage/ios-xcode-project"
          printf '%s\n' \
            '# Immortal Unzip — iOS / iPadOS' \
            '' \
            'Two ways to get Immortal Unzip on iPhone or iPad:' \
            '' \
            '## 1. Install the web app (no Mac required)' \
            '' \
            '1. Open https://socrtwo.github.io/Immortal-Zip/ in Safari.' \
            '2. Tap the Share button, then **Add to Home Screen**.' \
            '3. The app installs and works offline. (The pwa/ folder in' \
            '   this zip is the same app, for self-hosting.)' \
            '' \
            '## 2. Build the native app with Xcode' \
            '' \
            'Open ios-xcode-project/ImmortalUnzip.xcodeproj in Xcode 15+,' \
            'set your signing team, and press Run. See the README inside.' \
            > "$stage/INSTALL.md"
          (cd "$stage" && zip -r "$GITHUB_WORKSPACE/dist/Immortal-Zip-ios-${VERSION}.zip" .)
      - uses: actions/upload-artifact@v4
        with:
          name: chromeos-ios
          if-no-files-found: error
          path: dist/*.zip

  release:
    # Depend on every platform job, but run even if some of them failed or
    # were skipped: a single fragile platform (e.g. Android needs GitHub
    # Pages live, iOS needs Apple signing secrets) must NOT prevent the
    # release from attaching the assets that DID build. `always()` keeps
    # the job running; the tag guard keeps it tag-only.
    needs: [linux, macos, windows, android, ios, web, chromeos-ios]
    if: always() && (startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.tag != ''))
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          # Flatten every job's artifact into one directory.
          merge-multiple: true
      - name: List collected artifacts
        run: |
          echo "Artifacts to attach to the release:"
          find artifacts -type f -printf '  %p (%s bytes)\n' | sort
          if [ -z "$(find artifacts -type f)" ]; then
            echo "::error::No build artifacts were produced — refusing to publish an empty release." >&2
            exit 1
          fi
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: artifacts/**/*
